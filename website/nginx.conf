# Canonical scheme for this request.
# Behind a TLS-terminating proxy the original scheme arrives in X-Forwarded-Proto.
# A direct request (local preview) sends no such header, so it must not redirect
# or the container would loop on http://localhost:8080.
map $http_x_forwarded_proto $aitbm_insecure {
    default  0;
    "http"   1;
}

# Host canonicalisation: www.aitbm.org -> apex, all paths, permanent.
# The site's canonical/og:url/JSON-LD all point at https://aitbm.org, and Search
# Console already treats https://www.aitbm.org/ as a redirect; this makes every
# path agree instead of only the root.
server {
    listen       80;
    server_name  www.aitbm.org;
    return 301 https://aitbm.org$request_uri;
}

server {
    listen       80 default_server;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # MIME types (incl. image/svg+xml) come from the base image's mime.types include.

    # Plain-HTTP request that reached us through a proxy -> apex HTTPS, same path.
    if ($aitbm_insecure) {
        return 301 https://aitbm.org$request_uri;
    }

    # Serve the styled 404 page for missing routes
    error_page 404 /404.html;

    # Basic hardening headers (apply to all responses in this server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # Extensionless URLs (/calculator, /mappings/cvss, ...) as served in production.
        try_files $uri $uri.html $uri/ =404;
    }
}
